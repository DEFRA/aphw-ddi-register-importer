environment: production
environmentCode:
name: aphw-ddi-register-importer
namespace: aphw-ddi
workstream: aphw-ddi
image: aphw-ddi-register-importer

labels:
  component: service

appInsights:
  connectionString:

azureIdentity:
  clientID: not-a-real-clientID
  resourceID: not-a-real-resourceID

containerConfigMap:
  name: aphw-ddi-register-importer

containerSecret:
  name: aphw-ddi-register-importer

deployment: {}

container:
  requestMemory: 100Mi
  requestCpu: 100m
  limitMemory: 100Mi
  limitCpu: 100m
  port: 3000
  azureStorageUseConnectionString: false
  azureStorageAccountName: aphwddi
  importRequestQueueAddress: aphw-ddi-register-import-request
  messageQueueHost: host
  messageQueuePassword: password
  messageQueueUser: user
  ddiApiBaseUrl: aphw-ddi-api

workloadIdentity: true

secretProviderClass:
  azure:
    keyvaultName: SNDFFCINFKV2001
    objects:
      - objectName: snd2-aphw-appinsights-connectionString
        objectType: secret
  secretObjects:
    - secretName: aphw-ddi-register-importer
      type: Opaque
      data:
        - objectName: snd2-aphw-appinsights-connectionString
          key: APPINSIGHTS_CONNECTIONSTRING
